services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: eduvault
      MYSQL_USER: eduvault_app
      MYSQL_PASSWORD: "${DB_PASSWORD:?set DB_PASSWORD}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$$MYSQL_PASSWORD"
          mysql -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE"
          -e 'SELECT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data: